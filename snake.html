<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贪吃蛇 · 手动 / AI 双模式</title>
<style>
/* ============================================================
   主题配色：两套配色方案，用 CSS 变量实现，一键切换、刷新后保留
   ============================================================ */
:root[data-theme="light"] {
    --bg: #eef3f9;
    --panel: #ffffff;
    --panel-2: #f7fafd;
    --text: #12263a;
    --text-dim: #64748b;
    --line: #e2e8f0;
    --accent: #1d6fd0;
    --accent-soft: #e7f0fc;
    --board: #fbfdff;
    --grid: #e8eef6;
    --snake-head: #1b7f4d;
    --snake-body-a: #2fa86a;
    --snake-body-b: #8fd9b4;
    --food: #e5484d;
    --path: #c2410c;
    --shadow: 0 18px 40px rgba(16, 40, 70, 0.08), 0 4px 10px rgba(16, 40, 70, 0.05);
}
:root[data-theme="dark"] {
    --bg: #0d1420;
    --panel: #16202f;
    --panel-2: #1c2837;
    --text: #e8eef7;
    --text-dim: #93a4bb;
    --line: #26354a;
    --accent: #4da3ff;
    --accent-soft: #1b2c42;
    --board: #101a28;
    --grid: #1b2838;
    --snake-head: #38d08a;
    --snake-body-a: #26a86b;
    --snake-body-b: #14603d;
    --food: #ff5a5f;
    --path: #ffb020;
    --shadow: 0 20px 46px rgba(0, 0, 0, 0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', 'Microsoft YaHei', Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 18px 40px;
    transition: background-color .25s ease, color .25s ease;
}

.app {
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 20px;
    align-items: start;
}

.card {
    background: var(--panel);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 20px;
    border: 1px solid var(--line);
}

h1 {
    font-size: 1.45rem;
    font-weight: 650;
    letter-spacing: -.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
}
.subtitle { font-size: .84rem; color: var(--text-dim); margin-bottom: 16px; }

/* ---------- 计分板 ---------- */
.scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}
.score-cell {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 12px;
}
.score-cell .label { font-size: .72rem; color: var(--text-dim); }
.score-cell .value { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.score-cell.record .value { color: var(--accent); }

/* ---------- 画布 ---------- */
.board-wrap { position: relative; display: flex; justify-content: center; }
canvas {
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--board);
    display: block;
    touch-action: none;
}

/* ---------- 状态条 ---------- */
.status {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 34px;
    font-size: .9rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 12px;
}
.status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); flex: 0 0 auto;
}
.status.running .dot { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.16); }
.status.over .dot { background: var(--food); box-shadow: 0 0 0 4px rgba(229,72,77,.16); }
.status.win .dot { background: #eab308; box-shadow: 0 0 0 4px rgba(234,179,8,.18); }
.status.record { color: var(--accent); font-weight: 600; }

/* ---------- 按钮 ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button {
    font: inherit;
    font-size: .87rem;
    padding: 9px 15px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, background-color .18s ease, border-color .18s ease;
}
button:hover { background: var(--accent-soft); border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.07); }
button.danger:hover { background: rgba(229,72,77,.12); border-color: var(--food); color: var(--food); }

/* ---------- 设置区 ---------- */
.section-title {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    margin: 18px 0 9px;
    font-weight: 600;
}
.section-title:first-child { margin-top: 0; }

.radio-row { display: flex; flex-direction: column; gap: 7px; }
.radio-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel-2);
    cursor: pointer;
    transition: border-color .18s ease, background-color .18s ease;
}
.radio-item:hover { border-color: var(--accent); }
.radio-item.active { border-color: var(--accent); background: var(--accent-soft); }
.radio-item input { margin-top: 3px; accent-color: var(--accent); }
.radio-item .name { font-size: .9rem; font-weight: 600; }
.radio-item .desc { font-size: .76rem; color: var(--text-dim); line-height: 1.45; margin-top: 2px; }

.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-row .val { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--text-dim); min-width: 62px; text-align: right; }

/* ---------- 战绩列表 ---------- */
.history { display: flex; flex-direction: column; gap: 6px; }
.history-row {
    display: grid;
    grid-template-columns: 40px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: .83rem;
}
.history-row .idx { color: var(--text-dim); font-variant-numeric: tabular-nums; }
.history-row .sc { font-weight: 650; font-variant-numeric: tabular-nums; }
.history-row .tag {
    font-size: .72rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
}
.history-row .tag.wall { background: rgba(234,88,12,.14); color: #c2410c; }
.history-row .tag.self { background: rgba(229,72,77,.14); color: #d33; }
.history-row .tag.win  { background: rgba(234,179,8,.18); color: #a16207; }
.history-row .time { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: .78rem; }
.empty-hint { font-size: .82rem; color: var(--text-dim); padding: 6px 2px; }

.kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--panel-2);
    font-size: .78rem;
    font-family: ui-monospace, Consolas, monospace;
}
.help { font-size: .8rem; color: var(--text-dim); line-height: 1.9; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--text-dim); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

@media (max-width: 900px) {
    .app { grid-template-columns: 1fr; max-width: 520px; }
    canvas { width: 100%; height: auto; }
}
</style>
</head>
<body>

<div class="app">
    <!-- ================= 左：游戏区 ================= -->
    <section class="card">
        <h1>🐍 贪吃蛇</h1>
        <div class="subtitle">手动模式 ｜ 两套 AI 策略可对比</div>

        <div class="scoreboard">
            <div class="score-cell">
                <div class="label">本局得分</div>
                <div class="value" id="scoreValue">0</div>
            </div>
            <div class="score-cell record">
                <div class="label">最高分</div>
                <div class="value" id="highScoreValue">0</div>
            </div>
            <div class="score-cell">
                <div class="label">累计局数</div>
                <div class="value" id="gamesValue">0</div>
            </div>
        </div>

        <div class="board-wrap">
            <canvas id="canvas" width="440" height="440"></canvas>
        </div>

        <div class="status" id="status">
            <span class="dot"></span>
            <span id="statusText">按方向键或点「开始」开始游戏</span>
        </div>

        <div class="controls">
            <button class="primary" id="btnStart">开始 / 暂停</button>
            <button id="btnRestart">重新开始</button>
            <button id="btnTheme">🌙 深色主题</button>
            <button class="danger" id="btnReset">重置全部纪录</button>
        </div>

        <div class="legend">
            <span><i style="background:var(--snake-head)"></i>蛇头</span>
            <span><i style="background:var(--snake-body-a)"></i>蛇身</span>
            <span><i style="background:var(--food)"></i>食物</span>
            <span><i style="background:var(--path)"></i>AI 规划路径</span>
        </div>
    </section>

    <!-- ================= 右：设置 + 战绩 ================= -->
    <aside class="card">
        <div class="section-title">AI 策略</div>
        <div class="radio-row" id="aiGroup">
            <label class="radio-item" data-mode="off">
                <input type="radio" name="ai" value="off" />
                <span>
                    <span class="name">手动模式</span>
                    <div class="desc">用方向键控制，纯手玩。</div>
                </span>
            </label>
            <label class="radio-item" data-mode="greedy">
                <input type="radio" name="ai" value="greedy" />
                <span>
                    <span class="name">朴素贪心 AI（原始版）</span>
                    <div class="desc">只朝食物方向走近、不做防自陷判断。平均吃 30 个左右，测试中约 97% 的局能达到 15 个。</div>
                </span>
            </label>
            <label class="radio-item active" data-mode="smart">
                <input type="radio" name="ai" value="smart" checked />
                <span>
                    <span class="name">BFS 智能 AI（改进版）</span>
                    <div class="desc">广度优先搜索最短路径 + 「移动后仍能追到自己尾巴」安全性校验，无路可走时改为追尾保命。平均吃 65 个以上，300 局里 299 局达到 15 个。</div>
                </span>
            </label>
        </div>

        <div class="section-title">速度</div>
        <div class="slider-row">
            <input type="range" id="speed" min="17" max="33" step="1" value="24" />
            <span class="val" id="speedValue">约 7 步/秒</span>
        </div>

        <div class="section-title">最近 10 局战绩</div>
        <div class="history" id="history">
            <div class="empty-hint">还没有战绩，玩一局试试。</div>
        </div>

        <div class="section-title">操作说明</div>
        <div class="help">
            <span class="kbd">↑</span> <span class="kbd">↓</span> <span class="kbd">←</span> <span class="kbd">→</span> 控制方向<br />
            <span class="kbd">空格</span> 开始 / 暂停　<span class="kbd">R</span> 重新开始　<span class="kbd">T</span> 切换主题
        </div>
    </aside>
</div>

<!-- INLINE:BEGIN 本段由 build_snake.py 从 snake_core.js 与 snake_store.js 内联生成，请勿手工修改 -->
<script>
/* ==================== 来自 snake_core.js ==================== */
var SnakeCore = (function () {

    'use strict';

    const DIRS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
    };
    const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
    const ORDER = ['up', 'right', 'down', 'left'];

    function key(c) { return c.x + ',' + c.y; }

    function createGame(options) {
        const opt = options || {};
        const gridSize = opt.gridSize || 20;
        const rng = opt.rng || Math.random;
        // 安全性阈值：走完这一步后，剩余可活动空间至少要达到"蛇长 × spaceFactor"。
        // 1.0 是最宽松的下限，调大更保守（更不容易把自己盘死，但可能更保守而少吃食物）。
        const spaceFactor = opt.spaceFactor || 1.0;

        const state = {
            gridSize: gridSize,
            snake: [],
            food: { x: 0, y: 0 },
            direction: 'right',
            nextDirection: 'right',
            score: 0,
            status: 'ready',          // ready | running | over | win
            deathCause: null,         // wall | self | null
            aiStrategy: opt.aiStrategy || 'smart',   // smart | greedy | off
            aiPath: [],               // AI 最近规划的路径（画在画布上）
            aiLost: false             // AI 是否处于"先保命"状态
        };

        function inBounds(x, y) {
            return x >= 0 && x < gridSize && y >= 0 && y < gridSize;
        }

        /* ---------- 初始化 / 放食物 ---------- */
        function placeFood() {
            const occupied = new Set(state.snake.map(key));
            const free = [];
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    if (!occupied.has(x + ',' + y)) free.push({ x: x, y: y });
                }
            }
            if (free.length === 0) { state.status = 'win'; return; }
            // 枚举空格后均匀取样，避免"随机试 N 次"可能退化的情况
            state.food = free[Math.floor(rng() * free.length)];
        }

        function reset() {
            const mid = Math.floor(gridSize / 2);
            state.snake = [
                { x: mid, y: mid },
                { x: mid - 1, y: mid },
                { x: mid - 2, y: mid }
            ];
            state.direction = 'right';
            state.nextDirection = 'right';
            state.score = 0;
            state.status = 'ready';
            state.deathCause = null;
            state.aiPath = [];
            state.aiLost = false;
            placeFood();
        }

        /* ---------- 基础工具 ---------- */
        function bodyKeys(snakeArr, skipLast) {
            const s = new Set();
            const end = skipLast ? snakeArr.length - 1 : snakeArr.length;
            for (let i = 0; i < end; i++) s.add(key(snakeArr[i]));
            return s;
        }

        // BFS 最短路。blocked 为不可通行格集合；start/goal 永远视为可通行。
        function bfs(start, goal, blocked) {
            if (start.x === goal.x && start.y === goal.y) return [];
            const goalKey = key(goal);
            const prev = new Map();
            const startKey = key(start);
            prev.set(startKey, null);
            const queue = [start];
            let head = 0;
            while (head < queue.length) {
                const cur = queue[head++];
                for (let i = 0; i < ORDER.length; i++) {
                    const d = ORDER[i];
                    const nx = cur.x + DIRS[d].x, ny = cur.y + DIRS[d].y;
                    if (!inBounds(nx, ny)) continue;
                    const k = nx + ',' + ny;
                    if (prev.has(k)) continue;
                    if (k !== goalKey && blocked.has(k)) continue;   // 终点永远可达
                    prev.set(k, cur);
                    if (k === goalKey) {
                        const path = [];
                        let node = { x: nx, y: ny };
                        while (node) { path.push(node); node = prev.get(key(node)); }
                        path.pop();              // 去掉起点
                        return path.reverse();
                    }
                    queue.push({ x: nx, y: ny });
                }
            }
            return null;
        }

        // 从 start 出发能到达的空格数（洪水填充），用于判断是否把自己关死
        function reachableCount(start, blocked) {
            const seen = new Set([key(start)]);
            const queue = [start];
            let head = 0;
            while (head < queue.length) {
                const cur = queue[head++];
                for (let i = 0; i < ORDER.length; i++) {
                    const d = ORDER[i];
                    const nx = cur.x + DIRS[d].x, ny = cur.y + DIRS[d].y;
                    if (!inBounds(nx, ny)) continue;
                    const k = nx + ',' + ny;
                    if (blocked.has(k) || seen.has(k)) continue;
                    seen.add(k);
                    queue.push({ x: nx, y: ny });
                }
            }
            return seen.size;
        }

        // 手玩模式：不能掉头、不能撞自己（尾巴会让出）
        function legalMoves(snakeArr, dir) {
            const head = snakeArr[0];
            const out = [];
            for (let i = 0; i < ORDER.length; i++) {
                const d = ORDER[i];
                if (OPPOSITE[d] === dir) continue;
                const nx = head.x + DIRS[d].x, ny = head.y + DIRS[d].y;
                if (!inBounds(nx, ny)) continue;
                const eats = (nx === state.food.x && ny === state.food.y);
                const blocked = bodyKeys(snakeArr, !eats);
                if (blocked.has(nx + ',' + ny)) continue;
                out.push(d);
            }
            return out;
        }

        /* ---------- 安全性校验：走这一步之后会不会把自己关死 ---------- */
        function isSafeMove(snakeArr, dir) {
            const head = snakeArr[0];
            const nh = { x: head.x + DIRS[dir].x, y: head.y + DIRS[dir].y };
            if (!inBounds(nh.x, nh.y)) return false;

            const eats = (nh.x === state.food.x && nh.y === state.food.y);
            const newSnake = eats
                ? [nh].concat(snakeArr)
                : [nh].concat(snakeArr.slice(0, snakeArr.length - 1));

            // 撞自己
            for (let i = 1; i < newSnake.length; i++) {
                if (newSnake[i].x === nh.x && newSnake[i].y === nh.y) return false;
            }

            const headNew = newSnake[0];
            const tailNew = newSnake[newSnake.length - 1];
            // 目标格是尾巴，视为可通行；其余身体格视为障碍
            const blocked = bodyKeys(newSnake, true);
            blocked.delete(key(tailNew));

            // 不变量一：头必须还能追到自己的尾巴（经典"别把自己盘死"判据）
            if (bfs(headNew, tailNew, blocked) === null) return false;

            // 不变量二：剩余活动空间不能小于蛇长的 spaceFactor 倍
            const space = reachableCount(headNew, bodyKeys(newSnake, false));
            if (space < Math.ceil(newSnake.length * spaceFactor)) return false;

            return true;
        }

        function dirFromStep(head, stepCell) {
            for (let i = 0; i < ORDER.length; i++) {
                const d = ORDER[i];
                if (head.x + DIRS[d].x === stepCell.x && head.y + DIRS[d].y === stepCell.y) return d;
            }
            return null;
        }

        /* ---------- AI 策略一：朴素贪心（原始作业的实现，保留做对比） ---------- */
        function greedyMove() {
            const head = state.snake[0];
            const dx = state.food.x - head.x;
            const dy = state.food.y - head.y;
            let preferred;
            if (Math.abs(dx) >= Math.abs(dy)) {
                preferred = dx > 0 ? ['right', 'up', 'down', 'left'] : ['left', 'up', 'down', 'right'];
            } else {
                preferred = dy > 0 ? ['down', 'right', 'left', 'up'] : ['up', 'right', 'left', 'down'];
            }
            const legal = legalMoves(state.snake, state.direction);
            const blocked = bodyKeys(state.snake, true);   // 原版：只排除到倒数第二节
            for (let i = 0; i < preferred.length; i++) {
                const d = preferred[i];
                if (legal.indexOf(d) === -1) continue;
                const nh = { x: head.x + DIRS[d].x, y: head.y + DIRS[d].y };
                if (blocked.has(nh.x + ',' + nh.y)) continue;
                state.aiPath = [];
                state.aiLost = false;
                return d;
            }
            state.aiPath = [];
            return legal.length ? legal[0] : state.direction;
        }

        /* ---------- AI 策略二：BFS 最短路 + 安全性校验 + 追尾保命 ---------- */
        function smartMove() {
            const snake = state.snake;
            const head = snake[0];
            const legal = legalMoves(snake, state.direction);
            if (legal.length === 0) return state.direction;

            // 相邻就是食物：能安全吃就直接吃
            for (let i = 0; i < legal.length; i++) {
                const d = legal[i];
                const nh = { x: head.x + DIRS[d].x, y: head.y + DIRS[d].y };
                if (nh.x === state.food.x && nh.y === state.food.y && isSafeMove(snake, d)) {
                    state.aiPath = [];
                    state.aiLost = false;
                    return d;
                }
            }

            // 1) 沿 BFS 最短路走第一步，且这一步必须安全
            const blocked = bodyKeys(snake, true);
            const toFood = bfs(head, state.food, blocked);
            if (toFood && toFood.length > 0) {
                const d = dirFromStep(head, toFood[0]);
                if (d && legal.indexOf(d) !== -1 && isSafeMove(snake, d)) {
                    state.aiPath = toFood;
                    state.aiLost = false;
                    return d;
                }
                // 最短路第一步不安全：退一步，找"缩短距离且安全"的方向
                const curDist = Math.abs(head.x - state.food.x) + Math.abs(head.y - state.food.y);
                let best = null, bestDist = curDist;
                for (let i = 0; i < legal.length; i++) {
                    const d2 = legal[i];
                    const nh = { x: head.x + DIRS[d2].x, y: head.y + DIRS[d2].y };
                    const dist = Math.abs(nh.x - state.food.x) + Math.abs(nh.y - state.food.y);
                    if (dist < bestDist && isSafeMove(snake, d2)) { best = d2; bestDist = dist; }
                }
                if (best) { state.aiPath = []; state.aiLost = false; return best; }
            }

            // 2) 食物不可达或路径不安全 → 追自己的尾巴，先活下去
            state.aiLost = true;
            const tail = snake[snake.length - 1];
            if (!(head.x === tail.x && head.y === tail.y)) {
                const blocked2 = bodyKeys(snake, true);
                blocked2.delete(key(tail));
                const toTail = bfs(head, tail, blocked2);
                if (toTail && toTail.length > 0) {
                    const d = dirFromStep(head, toTail[0]);
                    if (d && legal.indexOf(d) !== -1 && isSafeMove(snake, d)) {
                        state.aiPath = toTail;
                        return d;
                    }
                }
            }

            // 3) 退而求其次：选活动空间最大的安全方向
            let bestD = null, bestSpace = -1;
            for (let i = 0; i < legal.length; i++) {
                const d = legal[i];
                if (!isSafeMove(snake, d)) continue;
                const nh = { x: head.x + DIRS[d].x, y: head.y + DIRS[d].y };
                const space = reachableCount(nh, bodyKeys(snake, false));
                if (space > bestSpace) { bestSpace = space; bestD = d; }
            }
            state.aiPath = [];
            if (bestD) return bestD;

            // 4) 实在没有安全方向 → 随便走一个合法的
            return legal[Math.floor(rng() * legal.length)];
        }

        function aiDecide() {
            if (state.aiStrategy === 'greedy') return greedyMove();
            if (state.aiStrategy === 'smart') return smartMove();
            return state.direction;
        }

        /* ---------- 走一步 ---------- */
        function step() {
            if (state.status !== 'running') return { moved: false };

            let dir;
            if (state.aiStrategy !== 'off') {
                dir = aiDecide();
            } else {
                dir = state.nextDirection;
                if (OPPOSITE[dir] === state.direction) dir = state.direction;
            }
            state.direction = dir;

            const head = state.snake[0];
            const nh = { x: head.x + DIRS[dir].x, y: head.y + DIRS[dir].y };

            if (!inBounds(nh.x, nh.y)) {
                state.status = 'over';
                state.deathCause = 'wall';
                return { moved: false, died: 'wall' };
            }

            const eats = (nh.x === state.food.x && nh.y === state.food.y);
            const newSnake = eats
                ? [nh].concat(state.snake)
                : [nh].concat(state.snake.slice(0, state.snake.length - 1));

            for (let i = 1; i < newSnake.length; i++) {
                if (newSnake[i].x === nh.x && newSnake[i].y === nh.y) {
                    state.status = 'over';
                    state.deathCause = 'self';
                    return { moved: false, died: 'self' };
                }
            }

            state.snake = newSnake;
            if (eats) {
                state.score++;
                if (state.snake.length === gridSize * gridSize) {
                    state.status = 'win';
                    return { moved: true, ate: true, win: true };
                }
                placeFood();
            }
            return { moved: true, ate: eats };
        }

        function setDirection(d) {
            if (!DIRS[d]) return false;
            if (OPPOSITE[d] === state.direction) return false;
            state.nextDirection = d;
            return true;
        }

        reset();

        return {
            state: state,
            reset: reset,
            step: step,
            setDirection: setDirection,
            start: function () { if (state.status === 'ready') state.status = 'running'; },
            DIRS: DIRS
        };
    }

    return { createGame: createGame, DIRS: DIRS };
})();

/* ==================== 来自 snake_store.js ==================== */
var SnakeStore = (function () {

    'use strict';

    const KEYS = {
        highScore: 'snake.highScore',
        gamesPlayed: 'snake.gamesPlayed',
        history: 'snake.history',
        theme: 'snake.theme'
    };
    const HISTORY_LIMIT = 10;   // 任务要求：记录最近 10 局

    function createStore(storage) {
        const s = storage;

        function readInt(key, fallback) {
            const raw = s.getItem(key);
            if (raw === null) return fallback;
            const n = parseInt(raw, 10);
            return Number.isFinite(n) ? n : fallback;
        }

        function write(key, value) {
            try { s.setItem(key, String(value)); } catch (e) { /* 隐私模式等情况下静默失败 */ }
        }

        return {
            KEYS: KEYS,
            HISTORY_LIMIT: HISTORY_LIMIT,

            getHighScore: function () { return readInt(KEYS.highScore, 0); },

            getGamesPlayed: function () { return readInt(KEYS.gamesPlayed, 0); },

            getTheme: function () {
                const t = s.getItem(KEYS.theme);
                return (t === 'dark' || t === 'light') ? t : 'light';
            },

            setTheme: function (t) { write(KEYS.theme, t); },

            // 只读的战绩列表（最近 10 局，最新的在前）
            getHistory: function () {
                const raw = s.getItem(KEYS.history);
                if (!raw) return [];
                try {
                    const arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr.slice(0, HISTORY_LIMIT) : [];
                } catch (e) {
                    return [];
                }
            },

            /* 一局结束：更新最高分、局数、并追加一条战绩。
               返回 { isNewRecord, highScore, gamesPlayed } 供界面做提示。 */
            recordGame: function (score, cause, durationMs) {
                const prevHigh = readInt(KEYS.highScore, 0);
                const isNewRecord = score > prevHigh;
                if (isNewRecord) write(KEYS.highScore, score);

                const games = readInt(KEYS.gamesPlayed, 0) + 1;
                write(KEYS.gamesPlayed, games);

                const history = this.getHistory();
                history.unshift({
                    score: score,
                    cause: cause || 'unknown',      // wall | self | win
                    at: Date.now(),
                    durationMs: durationMs || 0
                });
                try {
                    s.setItem(KEYS.history, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
                } catch (e) { /* 忽略写入失败 */ }

                return { isNewRecord: isNewRecord, highScore: Math.max(score, prevHigh), gamesPlayed: games };
            },

            /* 「重置」按钮用：清空最高分、局数与战绩。
               注意与「重新开始」的区别——重新开始只重开一局，不动纪录。 */
            resetAll: function () {
                [KEYS.highScore, KEYS.gamesPlayed, KEYS.history].forEach(function (k) {
                    try { s.removeItem(k); } catch (e) { /* 忽略 */ }
                });
            }
        };
    }

    // 浏览器环境下自动建一个基于 localStorage 的实例
    const auto = (typeof localStorage !== 'undefined') ? createStore(localStorage) : null;

    return { createStore: createStore, KEYS: KEYS, HISTORY_LIMIT: HISTORY_LIMIT, instance: auto };
})();

<script>
(function () {
    'use strict';

    var CELL = 22;                       // 每格像素
    var game = SnakeCore.createGame({ gridSize: 20 });
    var store = SnakeStore.instance;

    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var elScore = document.getElementById('scoreValue');
    var elHigh = document.getElementById('highScoreValue');
    var elGames = document.getElementById('gamesValue');
    var elStatus = document.getElementById('status');
    var elStatusText = document.getElementById('statusText');
    var elHistory = document.getElementById('history');
    var elSpeed = document.getElementById('speed');
    var elSpeedValue = document.getElementById('speedValue');

    var timer = null;
    var startedAt = 0;
    var lastRecorded = true;             // 防止同一局重复计入战绩

    /* ---------------- 配置：格子尺寸随网格算出 ---------------- */
    CELL = Math.floor(canvas.width / game.state.gridSize);

    /* ---------------- 主题 ---------------- */
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀️ 浅色主题' : '🌙 深色主题';
        store.setTheme(theme);
        draw();
    }
    function toggleTheme() {
        var now = document.documentElement.getAttribute('data-theme');
        applyTheme(now === 'dark' ? 'light' : 'dark');
    }

    /* ---------------- 界面刷新 ---------------- */
    function refreshScoreboard(highlightRecord) {
        elScore.textContent = game.state.score;
        elHigh.textContent = store.getHighScore();
        elGames.textContent = store.getGamesPlayed();
        if (highlightRecord) {
            elStatus.classList.add('record');
            elStatusText.textContent = '🏆 新纪录！本局 ' + game.state.score + ' 分，超过了之前的 ' + (store.getHighScore() - 0) ;
        }
    }

    function setStatus(text, cls) {
        elStatusText.textContent = text;
        elStatus.className = 'status' + (cls ? ' ' + cls : '');
    }

    function causeLabel(cause) {
        if (cause === 'wall') return { text: '撞墙', cls: 'wall' };
        if (cause === 'self') return { text: '撞到自己', cls: 'self' };
        if (cause === 'win') return { text: '通关', cls: 'win' };
        return { text: '结束', cls: '' };
    }

    function renderHistory() {
        var list = store.getHistory();
        if (!list.length) {
            elHistory.innerHTML = '<div class="empty-hint">还没有战绩，玩一局试试。</div>';
            return;
        }
        var html = '';
        list.forEach(function (rec, i) {
            var c = causeLabel(rec.cause);
            var d = new Date(rec.at);
            var hh = ('0' + d.getHours()).slice(-2);
            var mm = ('0' + d.getMinutes()).slice(-2);
            var secs = Math.round((rec.durationMs || 0) / 1000);
            html += '<div class="history-row">' +
                '<span class="idx">#' + (i + 1) + '</span>' +
                '<span class="sc">' + rec.score + ' 分</span>' +
                '<span class="tag ' + c.cls + '">' + c.text + '</span>' +
                '<span class="time">' + hh + ':' + mm + ' · ' + secs + 's</span>' +
                '</div>';
        });
        elHistory.innerHTML = html;
    }

    /* ---------------- 绘制 ---------------- */
    function draw() {
        var g = game.state;
        var N = g.gridSize;
        var size = N * CELL;
        var styles = getComputedStyle(document.documentElement);
        function css(name) { return styles.getPropertyValue(name).trim(); }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = css('--board');
        ctx.fillRect(0, 0, size, size);

        // 网格
        ctx.strokeStyle = css('--grid');
        ctx.lineWidth = 1;
        for (var i = 1; i < N; i++) {
            ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, size); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(size, i * CELL + .5); ctx.stroke();
        }

        // AI 规划路径（虚线）
        if (g.aiPath && g.aiPath.length) {
            ctx.save();
            ctx.strokeStyle = css('--path');
            ctx.globalAlpha = .55;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(g.snake[0].x * CELL + CELL / 2, g.snake[0].y * CELL + CELL / 2);
            g.aiPath.forEach(function (c) {
                ctx.lineTo(c.x * CELL + CELL / 2, c.y * CELL + CELL / 2);
            });
            ctx.stroke();
            ctx.restore();
        }

        // 蛇身：从头到尾做颜色渐变
        var n = g.snake.length;
        for (var k = n - 1; k >= 0; k--) {
            var seg = g.snake[k];
            var x = seg.x * CELL, y = seg.y * CELL;
            if (k === 0) {
                ctx.fillStyle = css('--snake-head');
            } else {
                var t = n > 2 ? (k / (n - 1)) : 0;
                ctx.fillStyle = mix(css('--snake-body-a'), css('--snake-body-b'), t);
            }
            roundRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3, 5);
            ctx.fill();
        }

        // 蛇头的眼睛：朝向当前移动方向
        var head = g.snake[0];
        var hx = head.x * CELL, hy = head.y * CELL;
        var d = SnakeCore.DIRS[g.direction] || { x: 1, y: 0 };
        var cx = hx + CELL / 2, cy = hy + CELL / 2;
        var perp = { x: -d.y, y: d.x };
        var eyeF = 4.2, eyeS = 4.4;
        for (var s = -1; s <= 1; s += 2) {
            var ex = cx + d.x * eyeF + perp.x * eyeS * s;
            var ey = cy + d.y * eyeF + perp.y * eyeS * s;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(ex, ey, 3.1, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0b1f14';
            ctx.beginPath(); ctx.arc(ex + d.x * 1.1, ey + d.y * 1.1, 1.6, 0, Math.PI * 2); ctx.fill();
        }

        // 食物
        var fx = g.food.x * CELL + CELL / 2;
        var fy = g.food.y * CELL + CELL / 2;
        ctx.fillStyle = css('--food');
        ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.33, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath(); ctx.arc(fx - CELL * 0.1, fy - CELL * 0.11, CELL * 0.09, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#22a06b';
        ctx.beginPath();
        ctx.ellipse(fx + CELL * 0.05, fy - CELL * 0.31, CELL * 0.16, CELL * 0.08, 0.5, 0, Math.PI * 2);
        ctx.fill();

        // 结束遮罩
        if (g.status === 'over' || g.status === 'win') {
            ctx.fillStyle = 'rgba(8, 18, 30, .55)';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = '600 26px "Segoe UI", "Microsoft YaHei", sans-serif';
            ctx.fillText(g.status === 'win' ? '🏆 通关！' : '游戏结束', size / 2, size / 2 - 14);
            ctx.font = '16px "Segoe UI", "Microsoft YaHei", sans-serif';
            ctx.fillText('本局得分 ' + g.score + '　最高分 ' + store.getHighScore(), size / 2, size / 2 + 20);
            if (g.status === 'over') {
                ctx.font = '14px "Segoe UI", "Microsoft YaHei", sans-serif';
                ctx.fillText(g.deathCause === 'wall' ? '撞到墙了' : '咬到自己了', size / 2, size / 2 + 46);
            }
            ctx.textAlign = 'start';
        }
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function mix(c1, c2, t) {
        var a = parseColor(c1), b = parseColor(c2);
        if (!a || !b) return c1;
        return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                        Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                        Math.round(a[2] + (b[2] - a[2]) * t) + ')';
    }
    function parseColor(s) {
        s = (s || '').trim();
        var m = s.match(/^#([0-9a-f]{6})$/i);
        if (m) {
            var v = parseInt(m[1], 16);
            return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
        }
        m = s.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        if (m) return [+m[1], +m[2], +m[3]];
        return null;
    }

    /* ---------------- 定时循环 ---------------- */
    function intervalMs() {
        return 680 - parseInt(elSpeed.value, 10) * 20;   // 17..33 -> 340..20 ms
    }
    function updateSpeedLabel() {
        var ms = intervalMs();
        elSpeedValue.textContent = '约 ' + (1000 / ms).toFixed(1) + ' 步/秒';
    }
    function startLoop() {
        stopLoop();
        timer = setInterval(tick, intervalMs());
    }
    function stopLoop() {
        if (timer) { clearInterval(timer); timer = null; }
    }

    /* ---------------- 一局的开始 / 结束 ---------------- */
    function beginRound(reset) {
        if (reset) { game.reset(); }
        game.start();
        startedAt = Date.now();
        lastRecorded = false;
        elStatus.classList.remove('record');
        setStatus(game.state.aiStrategy === 'off'
            ? '手动模式：用方向键控制'
            : (game.state.aiStrategy === 'greedy' ? '朴素贪心 AI 运行中…' : 'BFS 智能 AI 运行中…'), 'running');
        startLoop();
        draw();
    }

    function finishRound() {
        stopLoop();
        if (!lastRecorded) {
            lastRecorded = true;
            var res = store.recordGame(game.state.score, game.state.status === 'win' ? 'win' : game.state.deathCause, Date.now() - startedAt);
            refreshScoreboard(res.isNewRecord);
            if (!res.isNewRecord) {
                setStatus(game.state.status === 'win'
                    ? '🎉 通关！蛇占满了整个棋盘'
                    : (game.state.deathCause === 'wall' ? '💥 撞墙了，本局结束' : '💥 咬到自己了，本局结束'), 'over');
            }
            renderHistory();
        }
        draw();
    }

    function tick() {
        if (game.state.status !== 'running') { finishRound(); return; }
        var r = game.step();
        refreshScoreboard(false);
        if (game.state.status !== 'running') {
            finishRound();
            return;
        }
        if (game.state.aiLost) {
            setStatus('AI 暂时吃不到食物，正在追尾保命…', 'running');
        } else if (game.state.aiStrategy !== 'off') {
            setStatus(game.state.aiStrategy === 'greedy' ? '朴素贪心 AI 运行中…' : 'BFS 智能 AI 运行中…', 'running');
        }
        draw();
    }

    /* ---------------- 交互 ---------------- */
    document.getElementById('btnStart').addEventListener('click', function () {
        if (game.state.status === 'running') {
            stopLoop();
            game.state.status = 'paused';
            setStatus('已暂停', '');
            draw();
        } else if (game.state.status === 'ready' || game.state.status === 'paused') {
            if (game.state.status === 'ready') { startedAt = Date.now(); lastRecorded = false; }
            game.state.status = 'running';
            startLoop();
            setStatus('继续中…', 'running');
        } else {
            beginRound(true);
        }
    });

    document.getElementById('btnRestart').addEventListener('click', function () { beginRound(true); });

    document.getElementById('btnReset').addEventListener('click', function () {
        if (!confirm('确定要清空最高分、累计局数和最近战绩吗？此操作不可撤销。')) return;
        store.resetAll();
        refreshScoreboard(false);
        renderHistory();
        setStatus('已重置全部纪录（最高分、局数、战绩已清零）', '');
    });

    document.getElementById('btnTheme').addEventListener('click', toggleTheme);

    document.getElementById('aiGroup').addEventListener('change', function (e) {
        if (e.target.name !== 'ai') return;
        var mode = e.target.value;
        game.state.aiStrategy = mode;
        Array.prototype.forEach.call(document.querySelectorAll('.radio-item'), function (el) {
            el.classList.toggle('active', el.getAttribute('data-mode') === mode);
        });
        // 切换策略时重开一局，避免中途换脑导致方向冲突
        beginRound(true);
    });

    elSpeed.addEventListener('input', function () {
        updateSpeedLabel();
        if (game.state.status === 'running') startLoop();
    });

    document.addEventListener('keydown', function (e) {
        var k = e.key;
        if (k === ' ' || k === 'Spacebar') {
            e.preventDefault();
            document.getElementById('btnStart').click();
            return;
        }
        if (k === 'r' || k === 'R') { beginRound(true); return; }
        if (k === 't' || k === 'T') { toggleTheme(); return; }
        var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
        if (map[k]) {
            e.preventDefault();
            if (game.state.status === 'ready') { beginRound(false); }
            else if (game.state.status === 'paused') { game.state.status = 'running'; startLoop(); }
            game.setDirection(map[k]);
        }
    });

    // 触屏滑动
    var touchStart = null;
    canvas.addEventListener('touchstart', function (e) {
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener('touchend', function (e) {
        if (!touchStart) return;
        var dx = e.changedTouches[0].clientX - touchStart.x;
        var dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
        var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        if (game.state.status === 'ready') beginRound(false);
        game.setDirection(dir);
    }, { passive: true });

    /* ---------------- 启动 ---------------- */
    applyTheme(store.getTheme());
    updateSpeedLabel();
    refreshScoreboard(false);
    renderHistory();
    game.state.aiStrategy = 'smart';
    draw();
    // 若上次误留了暂停状态，保证初始可用
    game.state.status = 'ready';

    /* ---------------- 截图/演示模式：snake.html#demo ----------------
       带 #demo 打开时，直接铺一个"长蛇 + AI 正在追击"的场面并自动开始，
       方便给 README 截一张能体现 BFS 路径的可复现截图。 */
    if (location.hash === '#demo' || location.hash === '#demo-dark') {
        if (location.hash === '#demo-dark') applyTheme('dark');
        var g = game.state;
        g.snake = [
            { x: 6, y: 7 }, { x: 5, y: 7 }, { x: 4, y: 7 }, { x: 3, y: 7 }, { x: 2, y: 7 },
            { x: 2, y: 8 }, { x: 2, y: 9 }, { x: 3, y: 9 }, { x: 4, y: 9 }, { x: 5, y: 9 },
            { x: 6, y: 9 }, { x: 7, y: 9 }, { x: 8, y: 9 }, { x: 8, y: 8 }, { x: 8, y: 7 },
            { x: 9, y: 7 }, { x: 10, y: 7 }
        ];
        g.direction = 'right';
        g.nextDirection = 'right';
        g.score = 14;
        g.food = { x: 16, y: 4 };
        g.status = 'ready';
        lastRecorded = false;
        beginRound(false);
    }
})();
