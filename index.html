<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>林堉翰 · 个人主页</title>
    <style>
        /* 全局重置 + 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 6px 12px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            color: #0b1e33;
            letter-spacing: -0.5px;
        }

        .subhead {
            font-size: 1.1rem;
            color: #3a5a7a;
            margin-top: 4px;
            font-weight: 400;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, #d0ddee, transparent);
            margin: 22px 0 24px 0;
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-size: 1.05rem;
            padding: 6px 0;
            border-bottom: 1px solid #f0f3f8;
        }

        .info-label {
            font-weight: 500;
            color: #2a4a6a;
            min-width: 72px;
        }

        .info-value {
            color: #1a2e44;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }

        .badge {
            background: #eef4ff;
            color: #1f4a7a;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
        }

        .contact-link {
            color: #1f4a7a;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1.5px dashed #b3c9e0;
        }

        .contact-link:hover {
            border-bottom-color: #1f4a7a;
        }

        .footer-note {
            margin-top: 28px;
            font-size: 0.85rem;
            color: #7a8fa5;
            text-align: right;
            border-top: 1px solid #eef2f7;
            padding-top: 18px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }
            .info-label {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>林堉翰</h1>
    <div class="subhead">Lin Yuhan · 集成电路设计与集成系统</div>

    <div class="divider"></div>

    <div class="info-grid">
        <div class="info-row">
            <span class="info-label">🎓 专业</span>
            <span class="info-value">集成电路设计与集成系统</span>
        </div>
        <div class="info-row">
            <span class="info-label">🏸 兴趣</span>
            <span class="info-value">
                羽毛球运动 · 围棋
            </span>
        </div>
        <div class="info-row">
            <span class="info-label">📫 邮箱</span>
            <span class="info-value">
                <a href="mailto:seange1314@gmail.com" class="contact-link">seange1314@gmail.com</a>
            </span>
        </div>
        <div class="info-row" style="border-bottom: none; padding-bottom: 0;">
            <span class="info-label">🏷️ 标签</span>
            <div class="badge-group">
                <span class="badge">大一</span>
                <span class="badge">集成电路</span>
                <span class="badge">GitHub</span>
            </div>
        </div>
    </div>

    <div class="footer-note">
        🌱 广东工业大学 · 集成电路大学生科技创新协会
    </div>
</div>

</body>
</html>
